[project]
name = "starling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "clickhouse-connect==0.12.0rc1",
    "coolname>=3.0.0",
    "fsspec[gcs,s3]>=2024.12.0",
    "httpx[http2]>=0.28.1",
    "hydra-core>=1.3.2",
    "jinja2>=3.1.6",
    "logfire>=4.8.0",
    "norm-toolkit>=1.8.0",
    "numpy>=2.3.3",
    "openai>=1.84.0",
    "protobuf>=5.29.2,<6.0",
    "pydantic-ai-slim[openai,google,logfire,openrouter]>=1.39.0",
    "pydantic>=2.11.7",
    "pymilvus>=2.6.9",
    "python-dotenv>=1.1.1",
    "tenacity>=9.1.2",
    "tiktoken>=0.12.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipython>=9.8.0",
    "ipywidgets>=8.1.8",
    "polars>=1.30.0",
    "rich>=14.2.0",
]


[project.scripts]
starling = "starling.cli.starling:entry"
starling-eval = "starling.cli.evaluator:main"
starling-eval-summary = "starling.cli.evaluator:summary"

[build-system]
requires = ["uv_build>=0.8.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "FURB"]
ignore = ["B905", "E501", "SIM108"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.logfire]
ignore_no_config = true
